<style>
  :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; background: #f5f7fa; color: #18202a; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .shell { width: min(720px, calc(100% - 32px)); margin: 48px auto; }
  .eyebrow { margin: 0 0 6px; color: #49647e; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin: 0 0 28px; font-size: clamp(28px, 5vw, 42px); }
  .card { padding: 24px; border: 1px solid #dce3ea; border-radius: 16px; background: white; box-shadow: 0 8px 30px rgba(28, 45, 64, .07); }
  .card h2 { margin-top: 0; }
  .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 22px 0; }
  .metrics div { padding: 14px; border-radius: 10px; background: #f1f4f7; }
  dt { color: #607080; font-size: 13px; }
  dd { margin: 4px 0 0; font-size: 22px; font-weight: 700; }
  button { width: 100%; padding: 13px 16px; border: 0; border-radius: 10px; font-weight: 700; }
  @media (max-width: 480px) { .shell { margin-top: 24px; } }
</style>
