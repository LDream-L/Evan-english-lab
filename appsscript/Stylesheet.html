<style>
  :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; background: #f5f7fa; color: #18202a; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .shell { width: min(920px, calc(100% - 32px)); margin: 40px auto 80px; display: grid; gap: 20px; }
  .hero, .section-heading, .toolbar, .button-row, .inline-form { display: flex; align-items: end; justify-content: space-between; gap: 12px; }
  .eyebrow { margin: 0 0 6px; color: #49647e; font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 42px); }
  h2 { margin: 0 0 16px; font-size: 21px; }
  .section-heading h2 { margin-bottom: 0; }
  .card { padding: 24px; border: 1px solid #dce3ea; border-radius: 16px; background: white; box-shadow: 0 8px 30px rgba(28, 45, 64, .07); }
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0; }
  .metrics div { padding: 14px; border-radius: 10px; background: #f1f4f7; }
  dt, .muted { color: #607080; font-size: 13px; }
  dd { margin: 4px 0 0; font-size: 22px; font-weight: 700; }
  label { display: grid; gap: 6px; color: #526273; font-size: 13px; font-weight: 700; }
  input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid #ccd6df; border-radius: 9px; background: #fff; color: #18202a; font: inherit; }
  textarea { resize: vertical; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  button { padding: 12px 16px; border: 0; border-radius: 9px; background: #183b5b; color: white; font-weight: 800; cursor: pointer; }
  button:disabled { background: #b8c2cb; cursor: not-allowed; }
  button.compact { width: auto; white-space: nowrap; }
  .word-actions button { background: #edf2f6; color: #27445e; }
  .text-button { padding: 4px; background: transparent; color: #315b80; }
  .badge { padding: 6px 9px; border-radius: 999px; background: #e7eef5; color: #315b80; font-size: 12px; font-weight: 800; }
  .grow { flex: 1; }
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .form-grid button { align-self: end; }
  .checkbox { display: flex; grid-auto-flow: column; align-items: center; gap: 8px; }
  .checkbox input { width: auto; }
  .word-list { display: grid; gap: 10px; margin-top: 18px; }
  .word-item { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(160px, 2fr) auto; align-items: center; gap: 14px; padding: 13px; border: 1px solid #e2e8ee; border-radius: 10px; }
  .word-main { font-size: 17px; font-weight: 800; }
  .word-main small { display: block; color: #667786; font-size: 12px; font-weight: 600; }
  .word-actions { display: flex; gap: 6px; }
  .word-actions button { padding: 8px 10px; font-size: 12px; }
  .message { min-height: 20px; margin-bottom: 0; color: #315b80; }
  .message.error { color: #a02f2f; }
  .summary { min-height: 90px; padding: 14px; overflow: auto; border-radius: 10px; background: #111b24; color: #eaf2f8; white-space: pre-wrap; }
  .button-row { justify-content: flex-start; margin-top: 14px; }
  .hidden { display: none; }
  code { padding: 2px 5px; border-radius: 4px; background: #eef2f5; }
  @media (max-width: 700px) {
    .shell { margin-top: 24px; }
    .metrics, .form-grid { grid-template-columns: repeat(2, 1fr); }
    .toolbar, .inline-form { align-items: stretch; flex-direction: column; }
    .toolbar label, .inline-form label, .toolbar button, .inline-form button { width: 100%; }
    .word-item { grid-template-columns: 1fr; }
  }
  @media (max-width: 430px) { .metrics, .form-grid { grid-template-columns: 1fr; } .hero { align-items: start; } }
</style>
